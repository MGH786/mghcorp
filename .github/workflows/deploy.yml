name: Deploy full site to OVH

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to OVH via lftp
        run: |
          lftp -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ftp.cluster129.hosting.ovh.net <<EOF
          set ftp:ssl-allow no
          set ftp:passive-mode on
          mirror -R -v -e ./ www/ --exclude-glob .git* --exclude-glob .github/* --exclude-glob README.md
          bye
          EOF