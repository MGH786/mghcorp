name: Deploy full site to OVH

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to OVH via FTP
        uses: appleboy/ftp-action@master
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local: ./
          remote: www/
          exclude: |
            .git
            .【entity-github¦canonical_name=GitHub】