name: Deploy full site to OVH

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via FTP to OVH
        uses: sebastianbiallas/ftp-action@v2.0
        with:
          url: ftp://ftp.cluster129.hosting.ovh.net/www/
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: ./
          remoteDir: ./